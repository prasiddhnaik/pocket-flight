<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="t d">
  <title id="t">Pocket Flight</title>
  <desc id="d">Dusk sky with an aircraft in tracking brackets above a boarding pass: route Runway to Palm Bay, 6 aircraft, First light and Free flight modes, bun run dev, cleared.</desc>
  <defs>
    <clipPath id="round"><rect width="1000" height="550" rx="20"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082d33"/><stop offset=".38" stop-color="#0e3a41"/>
      <stop offset=".64" stop-color="#2c5a5c"/><stop offset=".86" stop-color="#b58f69"/><stop offset="1" stop-color="#ecd08c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".76" cy="1" r=".6" gradientTransform="translate(.24 0) scale(.7 1)">
      <stop offset="0" stop-color="#ffb299" stop-opacity=".8"/><stop offset="1" stop-color="#ffb299" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#233f42" stroke-opacity=".06"/>
    </pattern>
    <pattern id="bars" width="15" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" width="2" height="40" fill="#082d33"/><rect x="5" width="1" height="40" fill="#082d33"/><rect x="8" width="4" height="40" fill="#082d33"/>
    </pattern>
    <pattern id="ticks" width="18" height="7" patternUnits="userSpaceOnUse">
      <rect width="1" height="7" fill="#e8fbff" fill-opacity=".55"/>
    </pattern>
    <mask id="notch">
      <rect width="1000" height="550" fill="#fff"/>
      <circle cx="694" cy="330" r="13" fill="#000"/><circle cx="694" cy="520" r="13" fill="#000"/>
    </mask>
    <filter id="lift" x="-5%" y="-10%" width="110%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#082d33" flood-opacity=".32"/>
    </filter>
    <style>
      .serif{font-family:"DM Serif Display","Iowan Old Style",Georgia,serif}
      .inst{font-family:Oxanium,ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .lbl{font-size:11px;letter-spacing:2px;fill:#8a5a1c;font-weight:600}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="550" fill="#f6f4e9"/>
    <rect width="1000" height="550" fill="url(#grid)"/>

    <!-- dusk sky -->
    <rect width="1000" height="420" fill="url(#sky)"/>
    <rect width="1000" height="420" fill="url(#glow)"/>
    <g fill="#e8fbff">
      <circle cx="90" cy="86" r="1.4" opacity=".8"/><circle cx="210" cy="132" r="1" opacity=".6"/><circle cx="330" cy="70" r="1.6" opacity=".8"/>
      <circle cx="470" cy="118" r="1" opacity=".5"/><circle cx="560" cy="64" r="1.3" opacity=".7"/><circle cx="640" cy="150" r="1" opacity=".5"/>
      <circle cx="905" cy="80" r="1.5" opacity=".8"/><circle cx="960" cy="150" r="1" opacity=".6"/><circle cx="150" cy="210" r=".9" opacity=".5"/>
    </g>

    <!-- heading tape -->
    <g opacity=".75">
      <rect y="38" width="1000" height="7" fill="url(#ticks)"/>
      <g class="inst" font-size="12" letter-spacing="2" fill="#e8fbff" text-anchor="middle">
        <text x="180" y="28">340</text><text x="340" y="28">350</text><text x="500" y="28">000</text><text x="660" y="28">010</text><text x="820" y="28">020</text>
      </g>
      <path d="M495 45h10l-5-8z" fill="#ecd08c"/>
    </g>

    <!-- title -->
    <text x="56" y="116" class="inst" font-size="13" font-weight="600" letter-spacing="3" fill="#ecd08c">BROWSER FLIGHT GAME · PALM BAY</text>
    <text x="56" y="190" class="serif" font-size="68" fill="#f6f4e9">Pocket Flight</text>
    <text x="56" y="236" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" fill="#e4ece4">Fly Palm Bay, inspect the aircraft,</text>
    <text x="56" y="266" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" fill="#e4ece4">and turn a replay into a film.</text>

    <!-- tracked aircraft -->
    <g transform="translate(780 176)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 8;0 -8;0 8" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <g transform="rotate(56) scale(6.2) translate(-12 -12)" fill="#f6f4e9">
          <path d="M12 1l1.4 7 8.6 7v2l-8.6-3-.9 5 2.5 2v1l-3-.7-3 .7v-1l2.5-2-.9-5-8.6 3v-2l8.6-7z"/>
        </g>
      </g>
      <g stroke="#e8fbff" stroke-opacity=".75" stroke-width="1.5" fill="none">
        <path d="M-96 -72v24M-96 -72h24"/><path d="M96 -72v24M96 -72h-24"/>
        <path d="M-96 72v-24M-96 72h24"/><path d="M96 72v-24M96 72h-24"/>
      </g>
      <text x="96" y="98" class="inst" font-size="12" letter-spacing="2" fill="#e8fbff" text-anchor="end">STORMBIRD HX-40</text>
    </g>

    <!-- cloud deck -->
    <g fill="#f6f4e9">
      <ellipse cx="60" cy="430" rx="150" ry="42"/><ellipse cx="310" cy="440" rx="190" ry="48"/>
      <ellipse cx="560" cy="432" rx="170" ry="40"/><ellipse cx="800" cy="440" rx="200" ry="50"/>
      <ellipse cx="990" cy="428" rx="120" ry="38"/>
    </g>
    <rect y="430" width="1000" height="120" fill="#f6f4e9"/>
    <rect y="430" width="1000" height="120" fill="url(#grid)"/>

    <!-- boarding pass -->
    <g filter="url(#lift)">
      <g mask="url(#notch)">
        <rect x="56" y="330" width="888" height="190" rx="18" fill="#fffdf5"/>
      </g>
    </g>
    <line x1="694" y1="352" x2="694" y2="498" stroke="#233f42" stroke-opacity=".22" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="88" y="368" class="inst lbl">ROUTE</text>
    <text x="88" y="406" class="serif" font-size="32" fill="#082d33">Runway</text>
    <text x="660" y="406" class="serif" font-size="32" fill="#082d33" text-anchor="end">Palm Bay</text>
    <line x1="218" y1="396" x2="360" y2="396" stroke="#233f42" stroke-opacity=".28" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="410" y1="396" x2="518" y2="396" stroke="#233f42" stroke-opacity=".28" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(385 396) rotate(90) scale(1.1) translate(-12 -12)" fill="#8a5a1c">
      <path d="M12 2l2 7 8 4v2l-8-2-1 6 3 2v1l-4-1-4 1v-1l3-2-1-6-8 2v-2l8-4z"/>
    </g>

    <g class="inst" font-size="14">
      <text x="88" y="452" class="lbl">AIRCRAFT</text><text x="88" y="478" font-size="14" font-weight="700" fill="#082d33">6</text>
      <text x="196" y="452" class="lbl">MODES</text><text x="196" y="478" font-size="14" font-weight="700" fill="#082d33">First light · Free flight</text>
      <text x="440" y="452" class="lbl">STACK</text><text x="440" y="478" font-size="14" font-weight="700" fill="#082d33">Three.js · Bun</text>
      <text x="578" y="452" class="lbl">BOARDING</text><text x="578" y="478" font-size="14" font-weight="700" fill="#082d33">bun run dev</text>
    </g>

    <!-- stub -->
    <text x="726" y="368" class="inst lbl">STATUS</text>
    <rect x="726" y="382" width="146" height="34" rx="17" fill="#496851" fill-opacity=".13" stroke="#496851" stroke-width="1.5"/>
    <text x="799" y="404" class="inst" font-size="14" font-weight="700" letter-spacing="1" fill="#496851" text-anchor="middle">✓ CLEARED</text>
    <rect x="726" y="454" width="192" height="40" fill="url(#bars)" opacity=".85"/>
  </g>
</svg>
