<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Arrival at Palm Bay. Thanks for flying. Status landed, gear down, flaps full.">
  <defs>
    <clipPath id="r"><rect width="1000" height="190" rx="20"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#082d33"/><stop offset="1" stop-color="#12414a"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="lt">
      <circle cx="60" cy="172" r="8" fill="#ecd08c" opacity=".55" filter="url(#b)"/>
      <circle cx="60" cy="172" r="4.5" fill="#fff3cf"/>
    </g>
  </defs>
  <style>
    .serif{font-family:"DM Serif Display","Iowan Old Style",Georgia,serif}
    .inst{font-family:Oxanium,ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  </style>
  <g clip-path="url(#r)">
    <rect width="1000" height="190" fill="url(#g)"/>
    <text x="56" y="56" class="inst" font-size="12" font-weight="600" letter-spacing="3" fill="#ecd08c">ARRIVAL · PALM BAY</text>
    <text x="56" y="106" class="serif" font-size="44" fill="#f6f4e9">Thanks for flying.</text>
    <text x="56" y="136" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#cfe0dc">Happy landings, and see you on the next departure.</text>
    <line x1="720" y1="36" x2="720" y2="128" stroke="#e8fbff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 6"/>
    <g class="inst" font-size="14" font-weight="600" fill="#e8fbff">
      <text x="754" y="62" font-size="11" letter-spacing="2" fill="#ecd08c">STATUS</text>
      <text x="754" y="86" fill="#9fe0b0">✓ LANDED</text>
      <text x="754" y="108" xml:space="preserve">GEAR   DOWN</text>
      <text x="754" y="130" xml:space="preserve">FLAPS  FULL</text>
    </g>
    <rect y="154" width="1000" height="36" fill="#05242a"/>
    <use href="#lt"/><use href="#lt" x="110"/><use href="#lt" x="220"/><use href="#lt" x="330"/><use href="#lt" x="440"/>
    <use href="#lt" x="550"/><use href="#lt" x="660"/><use href="#lt" x="770"/><use href="#lt" x="880"/>
  </g>
</svg>
