<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Palm Bay · Island Explorer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px system-ui;
        color: #e8eee8;
        background: #162528;
      }
      canvas {
        display: block;
      }
      header {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        pointer-events: none;
      }
      header > * {
        pointer-events: auto;
      }
      a,
      button {
        color: inherit;
        text-decoration: none;
        border: 1px solid #ffffff29;
        background: #193035e6;
        border-radius: 6px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #ddcb96;
        color: #183034;
      }
      h1 {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.04em;
        margin: 0;
        padding: 12px 16px;
        background: #193035e6;
        border-radius: 6px;
      }
      nav {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      footer {
        position: absolute;
        bottom: 16px;
        left: 20px;
        background: #193035e6;
        border-radius: 6px;
        padding: 10px 14px;
        max-width: calc(100vw - 40px);
        font-size: 12px;
      }
      footer a {
        padding: 0;
        border: 0;
        background: none;
        text-decoration: underline;
      }
      #status {
        position: absolute;
        right: 20px;
        bottom: 16px;
        background: #193035e6;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 12px;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        background: #193035;
        color: #eee;
        font-size: 18px;
      }
      #loading[hidden] {
        display: none;
      }
      @media (max-width: 650px) {
        header {
          top: 10px;
          left: 10px;
          right: 10px;
        }
        h1 {
          display: none;
        }
        button {
          padding: 9px;
          font-size: 12px;
        }
        footer {
          bottom: 12px;
          left: 10px;
          font-size: 10px;
          max-width: 70%;
        }
        #status {
          right: 10px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/?aircraft=finch">← Pocket Flight</a>
      <h1>PALM BAY · ISLAND EXPLORER</h1>
      <nav aria-label="Island viewpoints">
        <button data-view="overview" aria-pressed="true">Island</button
        ><button data-view="village" aria-pressed="false">Village</button
        ><button data-view="airfield" aria-pressed="false">Airfield</button
        ><button data-view="coast" aria-pressed="false">Coast</button
        ><button data-view="forest" aria-pressed="false">Forest</button>
      </nav>
      <button id="night" aria-pressed="false">Evening</button>
    </header>
    <div id="loading" role="status">Loading coastal scenery…</div>
    <footer>
      Drag to orbit · Scroll to zoom · Right-drag to pan<br />Tree and limestone
      scans:
      <a href="https://polyhaven.com/" target="_blank" rel="noreferrer"
        >Poly Haven (CC0)</a
      >
      · Cottages inspired by
      <a
        href="https://www.loc.gov/item/hi0080/"
        target="_blank"
        rel="noreferrer"
        >HABS architectural records</a
      >
    </footer>
    <output id="status" aria-label="Rendering performance"
      >Preparing island</output
    >
    <script type="module" src="/src/scenery.ts"></script>
  </body>
</html>
